[project]
name = "jev-quiz-pilot"
version = "0.4.0"
description = "Let Jev (TypeSafe, via OpenRouter) navigate a web quiz in your Chrome, so you can measure how it does."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juan Fabrega" }]
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "python-dotenv>=1.2.3",
    "requests>=2.32",
]

[project.urls]
Homepage = "https://github.com/juanfabrega/jev-quiz-pilot"
Issues = "https://github.com/juanfabrega/jev-quiz-pilot/issues"

[project.scripts]
jev-quiz-pilot = "jev_quiz_pilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
