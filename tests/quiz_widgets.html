<!doctype html>
<html>
<body>
  <!-- Answers without form inputs: ARIA radios (like Google Forms), and clickable tiles (like JetPunk). -->
  <div role="radiogroup" aria-labelledby="q1">
    <div id="q1">What color is the sky?</div>
    <div role="radio" aria-checked="false" tabindex="0">Blue</div>
    <div role="radio" aria-checked="false" tabindex="0">Green</div>
  </div>
</body>
</html>
